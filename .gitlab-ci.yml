#
# CI for xfce4-beacon-theme.
#
# Jobs:
#   - check: every pipeline; shellcheck, then a full build
#   - package: tags v<X.Y.Z> only; builds the archive and uploads it
#   - release: tags v<X.Y.Z> only; creates the GitLab release
#
# Release flow:
#   - tag with a message: git tag -a v1.0.0 -m "<release notes>"
#   - package stops before uploading anything if the tag has no message
#   - package runs ./dist.sh and uploads dist/<NAME>.tar.gz to the project's
#     generic package registry, under the tag's version
#   - release creates the release, with the tag message as its notes, and links the archive
#   - the Releases page is the changelog
#   - the archive's permanent link for the newest release is
#     <project>/-/releases/permalink/latest/downloads/<NAME>.tar.gz

stages:
  - check
  - package
  - release

variables:
  NAME: xfce4-beacon-theme

.tag-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

check:
  stage: check
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends librsvg2-bin bc shellcheck
  script:
    - shellcheck --severity=error ./*.sh
    - ./build.sh beacon.conf

package:
  stage: package
  extends: .tag-only
  image: debian:stable-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends librsvg2-bin bc curl ca-certificates
  script:
    - test -n "$CI_COMMIT_TAG_MESSAGE" || { echo "tag $CI_COMMIT_TAG has no message; tag with git tag -a" >&2; exit 1; }
    - VERSION=${CI_COMMIT_TAG#v}
    - ./dist.sh
    - >-
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "dist/$NAME.tar.gz"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$NAME/$VERSION/$NAME.tar.gz"

release:
  stage: release
  extends: .tag-only
  image:
    name: registry.gitlab.com/gitlab-org/cli:latest
    entrypoint: [""]
  needs:
    - package
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$NAME/$VERSION/$NAME.tar.gz"
    - >-
      glab release create "$CI_COMMIT_TAG"
      --name "$CI_COMMIT_TAG"
      --notes "$CI_COMMIT_TAG_MESSAGE"
      --assets-links "[{\"name\": \"$NAME.tar.gz\", \"url\": \"$URL\", \"direct_asset_path\": \"/$NAME.tar.gz\", \"link_type\": \"package\"}]"
