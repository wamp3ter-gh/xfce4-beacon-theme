#
# beacon.conf: the xfwm4 themes ./build.sh renders.
#
# Format
#   - one entry per line
#   - a line starting with # is a comment
#   - a comment cannot follow an entry on the same line
#   - blank lines are ignored
#
# Entries
#   - colour <name> <#rrggbb>
#       an accent colour, used by theme lines
#   - glyphs <name> [<button>=<set> ...]
#       which drawing each title-bar button uses
#   - theme <name> colour=<names> [<key>=<value> ...]
#       one xfwm4 theme, installed as <name>
#
# Names
#   - colour, glyph set and key names: letters, digits, _ and -
#   - theme names: also ., but not as the first character
#   - theme names become folder names
#
# ---------------------------------------------------------------------------
# colour <name> <#rrggbb>
#
#   The accent colours:
#   - focus stripe
#   - corner brackets
#   - toggled and pressed buttons
#
# ---------------------------------------------------------------------------
# glyphs <name> [<button>=<set> ...]
#
#   Buttons:
#   - menu: the window menu
#   - stick: show on every workspace (xfwm4's "Always on Visible Workspace")
#   - shade: roll up to the title bar
#   - hide: minimise
#   - max: maximise
#   - close
#
#   Sets:
#   - a
#   - b
#   - c (default)
#
#   A button left out uses set c.
#   Glyph set c (every button from c) is built in; its line below only spells it out.
#
# ---------------------------------------------------------------------------
# theme <name> colour=<names> [<key>=<value> ...]
#
#   Lists:
#   - colour, tone, inactive, shape, glyphs and ink take comma lists
#   - one line then makes every combination
#   - {colour} {tone} {inactive} {shape} {glyphs} {ink} in <name> are filled in for each
#   - every other key takes one value
#
#   Keys:
#   - colour: colour names (required)
#
#   - tone: title bar
#       - dark (default): slate title bars
#       - light: pale title bars; needs a darker accent (the -light colours below)
#
#   - inactive: unfocused windows
#       - tint (default): a hint of the accent
#           - dark tone: 30% of the accent in the stripe and corners
#           - light tone: a 10% wash over the title bar
#       - neutral: no accent; the strongest focus cue
#
#   - shape: button background
#       - disc (default): filled circle
#       - ring: circle outline
#       - bare: glyph only
#
#   - glyphs: a glyph set name
#       - c (default)
#
#   - ink: glyph colour
#       - cream (default): neutral
#       - accent: the theme's colour
#
#   - line: border drawn beside the window, px
#       - 1 (default): hair
#       - 2: thin
#       - 8: solid band
#
#   - knee: thickness of the corner brackets, px
#       - 3 (default)
#
#   - grab: frame width on each side, px
#       - 4 (default)
#       - at least line and knee
#       - past the drawing the frame is transparent
#       - xfwm4 4.20 cannot click transparent pixels
#       - so a larger grab widens the frame, not the grab area (see README)
#
#   - mesh: fill the frame beyond the line
#       - 0 (default): leave it clear; only the drawn line grabs
#       - 1: a 1px checkerboard; its solid pixels grab
#       - the checkerboard is the accent on the focused window, neutral on others
#
#   - tl, tr, bl, br: focused window's corner colours
#       - top-left, top-right, bottom-left, bottom-right
#       - a colour name above, or #rrggbb
#       - default: the theme's colour
#       - unfocused corners follow inactive
#
#   Numbers (line, knee, grab):
#   - whole numbers, 1 or more
#   - no leading zeros

# tones from the terminal palette
colour steel   #a1bfdb
colour teal    #86c4b7
colour sand    #decc82
colour rose    #d78685
# the same accents for light title bars, dark enough for 3:1 contrast on them
colour steel-light  #3f6f9a
colour teal-light   #2f7a6b
colour sand-light   #a24e18
# high visibility
colour cyan    #00e5ff
colour yellow  #ffe600
colour lime    #c0ff00
colour magenta #ff00ff
colour amber   #ffb000
colour orange  #ff7a1a

# a: dots, pin, bar + chevron, corner brackets, X
glyphs a  menu=a stick=a shade=a hide=a max=a close=a
# b: lines, layered squares, rolled title, underscore, square, X
glyphs b  menu=b stick=b shade=b hide=b max=b close=b
# c: caret, rising arrow, double chevron, arrow into a bar, diagonals, round X
glyphs c  menu=c stick=c shade=c hide=c max=c close=c

theme beacon-{colour}      colour=steel,teal,sand
theme beacon-{colour}-ink  colour=steel,teal,sand ink=accent
theme beacon-{colour}      colour=steel-light,teal-light,sand-light tone=light
theme beacon-{colour}-ink  colour=steel-light,teal-light,sand-light tone=light ink=accent
